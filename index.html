<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NITZEX VISUAL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0a0a0a;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.8;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NITZEX VISUAL</h1>
    <p>
      Building the future of creativity through AI, content systems,
      visual storytelling, and creator-focused education.
    </p>
    <a class="btn" href="https://github.com/nitzexvisualgit/nitzex-visual" target="_blank">
      View Repository
    </a>
  </div>
</body>
</html>
